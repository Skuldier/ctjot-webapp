{% extends "base.html" %}
{% block title %}Error - Jets of Time - Local{% endblock %}
{% block content %}
<section class="error">
  <h1>Something went wrong</h1>
  <p>{{ message }}</p>
  {% if detail %}
    <pre class="detail">{{ detail }}</pre>
  {% endif %}
  <p><a href="{{ url_for('options_page') }}">Back to the options page</a></p>
</section>
{% endblock %}
